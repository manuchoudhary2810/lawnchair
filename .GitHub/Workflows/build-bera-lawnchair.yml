name: Build Lawnchair with Bera OPPO icons

on:
  push:
    paths:
      - ".github/workflows/build-bera-lawnchair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lawnchair
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Bera OPPO icon pack
        uses: actions/checkout@v4
        with:
          repository: manuchoudhary2810/BeraOPPOTheme
          path: .bera-oppo-theme

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integrate icons into Lawnchair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          theme = root / ".bera-oppo-theme" / "app" / "src" / "main" / "res"
          source_icons = theme / "drawable-nodpi"
          target_icons = root / "lawnchair" / "res" / "drawable-nodpi"
          target_xml = root / "lawnchair" / "res" / "xml"

          if not source_icons.is_dir():
              raise SystemExit(f"Icon source folder not found: {source_icons}")

          icon_files = sorted(source_icons.glob("*.png"))
          if not icon_files:
              raise SystemExit("BeraOPPOTheme contains no drawable-nodpi PNG icons.")

          target_icons.mkdir(parents=True, exist_ok=True)
          target_xml.mkdir(parents=True, exist_ok=True)
          icon_names = {}
          for icon in icon_files:
              name = f"bera_{icon.stem}"
              icon_names[icon.stem] = name
              shutil.copy2(icon, target_icons / f"{name}.png")

          appfilter_source = theme / "xml" / "appfilter.xml"
          if not appfilter_source.is_file():
              raise SystemExit(f"Theme appfilter not found: {appfilter_source}")

          appfilter = ET.parse(appfilter_source)
          for element in appfilter.iter():
              for attribute in ("drawable", "prefix", "img1", "img2", "img3"):
                  value = element.get(attribute)
                  if value in icon_names:
                      element.set(attribute, icon_names[value])
          appfilter.write(
              target_xml / "appfilter.xml",
              encoding="utf-8",
              xml_declaration=True,
          )

          drawable_root = ET.Element("resources")
          category = ET.SubElement(drawable_root, "category", {"title": "Bera OPPO"})
          for name in icon_names.values():
              ET.SubElement(category, "item", {"drawable": name})
          ET.ElementTree(drawable_root).write(
              target_xml / "drawable.xml",
              encoding="utf-8",
              xml_declaration=True,
          )

          manifest_path = root / "AndroidManifest.xml"
          manifest = manifest_path.read_text(encoding="utf-8")
          theme_filter = """
              <intent-filter>
                  <action android:name="com.novalauncher.THEME" />
                  <category android:name="android.intent.category.DEFAULT" />
              </intent-filter>"""
          if "com.novalauncher.THEME" not in manifest:
              activity_pattern = re.compile(
                  r"<activity\b[^>]*>.*?</activity>", re.DOTALL
              )
              for match in activity_pattern.finditer(manifest):
                  activity = match.group(0)
                  if (
                      "android.intent.action.MAIN" in activity
                      and "android.intent.category.LAUNCHER" in activity
                  ):
                      updated = activity.replace(
                          "</activity>", f"{theme_filter}\n        </activity>"
                      )
                      manifest = (
                          manifest[:match.start()]
                          + updated
                          + manifest[match.end():]
                      )
                      break
              else:
                  raise SystemExit(
                      "Could not find Lawnchair's existing launcher activity "
                      "to register the built-in icon pack."
                  )
              manifest_path.write_text(manifest, encoding="utf-8")

          preferences_path = (
              root
              / "lawnchair"
              / "src"
              / "app"
              / "lawnchair"
              / "preferences"
              / "PreferenceManager.kt"
          )
          preferences = preferences_path.read_text(encoding="utf-8")
          old_default = (
              'val iconPackPackage = '
              'StringPref("pref_iconPackPackage", "", reloadIcons)'
          )
          new_default = (
              'val iconPackPackage = '
              'StringPref("pref_iconPackPackage", context.packageName, reloadIcons)'
          )
          if old_default in preferences:
              preferences_path.write_text(
                  preferences.replace(old_default, new_default, 1),
                  encoding="utf-8",
              )
          elif new_default not in preferences:
              raise SystemExit(
                  "Could not find the expected icon-pack preference default; "
                  "refusing to build with Bera icons not selected by default."
              )
          PY

      - name: Build Lawnchair APK
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4g" >> gradle.properties
          ./gradlew assembleLawnWithQuickstepNightlyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-bera-oppo-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error

